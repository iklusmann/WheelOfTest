<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WheelOfTest — Business logic tests</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    .test-card { max-width: 960px; margin: 22px auto; padding: 28px; }
    #test-results { display: grid; gap: 10px; padding-left: 0; list-style: none; }
    #test-results li { padding: 12px 14px; border-radius: 12px; background: #f7f5fa; font-size: .85rem; line-height: 1.45; }
    #test-results li.passed { border: 1px solid #d6efe5; background: #f0fbf6; }
    #test-results li.failed { border: 1px solid #f2cbd8; background: #fff2f5; }
    #test-results li strong { margin-right: 6px; font-size: .72rem; }
    .passed strong { color: #267a62; }
    .failed strong { color: #a6425b; }
  </style>
  <script type="module" src="./tests.js"></script>
</head>
<body>
  <div class="site-shell">
    <header class="topbar"><a class="brand" href="./"><span class="brand-mark" aria-hidden="true">✳</span><span>WheelOfTest</span></a><div class="topbar-tag">Standalone test harness</div></header>
    <main class="main-content">
      <section class="card test-card">
        <p class="eyebrow">Pure business logic</p>
        <h1 style="font-size:clamp(2rem,5vw,3rem)">Assignment rules check</h1>
        <p class="subtle">This no-build harness checks task eligibility, team priority, and the two-spin complaint lifecycle. It does not test real browser-to-browser network connectivity.</p>
        <h2 id="test-summary">Running tests…</h2>
        <ol id="test-results"></ol>
        <a class="button button-soft" href="./">← Back to WheelOfTest</a>
      </section>
    </main>
  </div>
</body>
</html>
