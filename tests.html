<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WheelOfTest — domain tests</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 24px 16px; background: #090B0F; color: #F4F1E9; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 860px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    #summary { font-weight: 600; margin: 0 0 16px; }
    .pass { color: #70B99C; } .fail { color: #E07878; }
    ol { padding-left: 0; list-style: none; margin: 0; }
    li { padding: 6px 0; border-bottom: 1px solid #2A3440; overflow-wrap: anywhere; }
    li .detail { display: block; color: #E07878; font-family: ui-monospace, monospace; font-size: 13px; white-space: pre-wrap; }
  </style>
</head>
<body>
<main>
  <h1>WheelOfTest — domain.js tests</h1>
  <p id="summary" role="status">Running…</p>
  <ol id="results"></ol>
</main>

<script type="module">
import {
  validateProfile, normalizeRoomCode, canReceiveTask, assignTasks,
  seededRandom, shuffle, spinRule, UNASSIGNED_NO_PHONE, ROOM_CODE_ALPHABET,
  normalizeTask, taskPhones, unassignedReason, validateTask, validateTaskList,
  newTaskId, sameTaskList, isDefaultTaskList, tasksEditable
} from "./domain.js";
import { DEFAULT_TASKS as TASKS, defaultTasks, DEVICES, BROWSERS, USER_LEVELS, THEMES } from "./tasks.js";

// ---------------------------------------------------------------- tiny runner
const results = [];
function test(name, fn) {
  try { fn(); results.push({ name, ok: true }); }
  catch (error) { results.push({ name, ok: false, error: error && error.message ? error.message : String(error) }); }
}
function assert(condition, message) { if (!condition) throw new Error(message || "assertion failed"); }
function equal(actual, expected, message) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a !== e) throw new Error(`${message || "not equal"}\n  expected: ${e}\n  actual:   ${a}`);
}

// ---------------------------------------------------------------- fixtures
let nextId = 0;
function person(name, team, { android = false, ios = false, online = true } = {}) {
  nextId += 1;
  return { user_id: `u-${String(nextId).padStart(3, "0")}-${name}`, name, team, android, ios, online };
}
const isMobile = (task) => taskPhones(task).length > 0;   // needs a phone
const MOBILE = TASKS.filter(isMobile);
const DESKTOP = TASKS.filter((t) => !isMobile(t));
const byId = (list) => new Map(list.map((x) => [x.user_id, x]));
function assignedTo(result, userId) { return result.assignments.filter((a) => a.participant_id === userId); }
function loads(result, people) {
  const m = new Map(people.map((p) => [p.user_id, 0]));
  for (const a of result.assignments) if (a.participant_id) m.set(a.participant_id, m.get(a.participant_id) + 1);
  return m;
}
function deepFreeze(value) {
  if (value && typeof value === "object") { Object.values(value).forEach(deepFreeze); Object.freeze(value); }
  return value;
}
function randomRoster(random) {
  const teams = ["AF", "CYD", "PB"];
  const size = 1 + Math.floor(random() * 9);
  const roster = [];
  for (let i = 0; i < size; i += 1) {
    const device = Math.floor(random() * 4); // 0 none, 1 android, 2 ios, 3 both
    roster.push(person(`p${i}`, teams[Math.floor(random() * 3)], {
      android: device === 1 || device === 3,
      ios: device === 2 || device === 3,
      online: random() < 0.8
    }));
  }
  return roster;
}

// ---------------------------------------------------------------- task data
test("tasks.js has the 16 default tasks with unique ids and valid values", () => {
  equal(TASKS.length, 16, "task count");
  equal(new Set(TASKS.map((t) => t.id)).size, 16, "unique ids");
  const values = (options) => options.map((o) => o.value);
  for (const t of TASKS) {
    assert(t.devices.length > 0 && t.devices.every((d) => values(DEVICES).includes(d)), `devices of ${t.id}`);
    assert(t.browsers.every((b) => values(BROWSERS).includes(b)), `browsers of ${t.id}`);
    assert(t.users.every((u) => values(USER_LEVELS).includes(u)), `users of ${t.id}`);
    assert(values(THEMES).includes(t.theme), `theme of ${t.id}`);
    assert(t.team === null || ["AF", "CYD", "PB"].includes(t.team), `team of ${t.id}`);
    equal(validateTask(t).ok, true, `${t.id} passes the editor's validation`);
  }
  equal(TASKS.filter((t) => t.what === "CD Release").every((t) => t.team === "CYD"), true, "CD Release belongs to CYD");
  equal(MOBILE.length, 8, "mobile task count");
  assert(MOBILE.every((t) => JSON.stringify(t.devices) === '["android","ios"]' && t.browsers.length === 0), "mobile = either phone, no browser");
  equal(validateTaskList(TASKS).ok, true, "default list is valid");
});

// ---------------------------------------------------------------- defaults stay default
test("the defaults are frozen and defaultTasks() hands out independent copies", () => {
  assert(Object.isFrozen(TASKS) && TASKS.every((t) => Object.isFrozen(t) && Object.isFrozen(t.devices)), "deep-frozen");
  const a = defaultTasks();
  const b = defaultTasks();
  a[0].what = "Changed";
  a[1].devices.push("ios");
  a.splice(2, 1);
  equal(b, JSON.parse(JSON.stringify(TASKS)), "a second copy is untouched");
  equal(TASKS[0].what, "Critical User Flows", "the defaults are untouched");
  equal(isDefaultTaskList(b), true, "fresh copy is the default set");
  equal(isDefaultTaskList(a), false, "edited copy is not");
});

test("sameTaskList compares fields and order, not key order or legacy shape", () => {
  const reordered = TASKS.map((t) => ({ users: t.users, browsers: t.browsers, devices: t.devices, team: t.team, theme: t.theme, what: t.what, id: t.id }));
  equal(sameTaskList(reordered, TASKS), true, "key order ignored");
  equal(sameTaskList([...TASKS].reverse(), TASKS), false, "order matters");
  equal(sameTaskList(TASKS.slice(1), TASKS), false, "length matters");
});

// ---------------------------------------------------------------- legacy rooms
// Rooms created before tasks were editable stored { device, platform } instead of { devices, browsers }.
const legacyOf = (t) => ({
  id: t.id, what: t.what, theme: t.theme,
  device: isMobile(t) ? "mobile" : t.browsers[0], platform: isMobile(t) ? "mobile" : "desktop",
  team: t.team, users: t.users
});

test("normalizeTask turns every legacy default task into exactly the new default", () => {
  for (const t of TASKS) equal(normalizeTask(legacyOf(t)), { ...JSON.parse(JSON.stringify(t)), browsers: t.browsers.slice(0, 1) }, t.id);  // a legacy task had one browser
  equal(normalizeTask(TASKS[3]), JSON.parse(JSON.stringify(TASKS[3])), "current shape passes through");
  equal(normalizeTask({ id: "x", what: "W", theme: "flow", team: "AF", devices: ["ios"], browsers: ["safari"], users: [], extra: 1 }),
    { id: "x", what: "W", theme: "flow", team: "AF", devices: ["ios"], browsers: ["safari"], users: [] }, "unknown fields dropped");
});

test("legacy tasks assign exactly like the new defaults (same seed, same result)", () => {
  const roster = [person("A", "AF", { android: true }), person("B", "PB"), person("C", "CYD", { ios: true }), person("D", "AF")];
  for (let seed = 1; seed <= 40; seed += 1) {
    const now = assignTasks(TASKS, roster, seededRandom(seed));
    const old = assignTasks(TASKS.map(legacyOf), roster, seededRandom(seed));
    equal(old, now, `seed ${seed}`);
  }
});

// ---------------------------------------------------------------- devices per task
const task = (id, devices, team = null) => ({ id, what: `T ${id}`, theme: "e3dc", team, devices, browsers: [], users: [] });

test("canReceiveTask follows the task's devices: phones are not interchangeable", () => {
  const none = person("None", "AF"), droid = person("Droid", "AF", { android: true });
  const iphone = person("Iphone", "AF", { ios: true }), both = person("Both", "AF", { android: true, ios: true });
  const cases = [
    [["desktop"], [true, true, true, true]],
    [["mac"], [true, true, true, true]],
    [["android"], [false, true, false, true]],
    [["ios"], [false, false, true, true]],
    [["android", "ios"], [false, true, true, true]],
    [["desktop", "ios"], [false, false, true, true]],
    [["desktop", "android", "ios"], [false, true, true, true]]
  ];
  for (const [devices, expected] of cases) {
    equal([none, droid, iphone, both].map((p) => canReceiveTask(task("x", devices), p)), expected, JSON.stringify(devices));
  }
});

test("an Android-only task with only iOS people online is Unassigned with an Android reason", () => {
  const tasks = [task("droid", ["android"]), task("apple", ["ios"]), task("any", ["android", "ios"]), task("desk", ["desktop"])];
  const r = assignTasks(tasks, [person("I", "AF", { ios: true }), person("D", "PB")], seededRandom(4));
  const by = new Map(r.assignments.map((a) => [a.task_id, a]));
  equal(by.get("droid").participant_id, null, "android task unassigned");
  equal(by.get("droid").reason, "No one online has an Android phone.", "reason");
  assert(by.get("apple").participant.ios, "iOS task to the iPhone owner");
  assert(by.get("any").participant.ios, "either-phone task to the iPhone owner");
  assert(by.get("desk").participant_id !== null, "desktop task assigned");
});

test("unassignedReason names the phones the task needs", () => {
  equal(unassignedReason(task("a", ["android"])), "No one online has an Android phone.", "android");
  equal(unassignedReason(task("b", ["ios", "desktop"])), "No one online has an iOS phone.", "ios");
  equal(unassignedReason(task("c", ["ios", "android"])), UNASSIGNED_NO_PHONE, "both, in fixed order");
  equal(unassignedReason(legacyOf(MOBILE[0])), UNASSIGNED_NO_PHONE, "legacy mobile");
});

test("property check over 500 random custom task lists: device rule, team rule, completeness", () => {
  const all = ["desktop", "android", "ios"];
  const teams = ["AF", "CYD", "PB", null];
  for (let seed = 1; seed <= 500; seed += 1) {
    const random = seededRandom(seed * 31);
    const roster = randomRoster(random);
    const n = 1 + Math.floor(random() * 30);
    const tasks = Array.from({ length: n }, (_, i) => {
      let devices = all.filter(() => random() < 0.5);
      if (devices.length === 0) devices = [all[Math.floor(random() * 3)]];
      return task(`t${i}`, devices, teams[Math.floor(random() * 4)]);
    });
    const r = assignTasks(tasks, roster, random);
    const online = roster.filter((p) => p.online);
    if (online.length === 0) { equal(r.ok, false, `seed ${seed} empty`); continue; }
    equal(r.assignments.map((a) => a.task_id), tasks.map((t) => t.id), `seed ${seed}: every task once, in order`);
    const people = byId(roster);
    for (const a of r.assignments) {
      const compatible = online.filter((p) => canReceiveTask(a.task, p));
      if (a.participant_id === null) {
        equal(compatible.length, 0, `seed ${seed}: ${a.task_id} unassigned while someone could take it`);
        equal(a.reason, unassignedReason(a.task), "reason");
        continue;
      }
      const p = people.get(a.participant_id);
      assert(p.online && canReceiveTask(a.task, p), `seed ${seed}: device rule broken on ${a.task_id}`);
      if (a.task.team) equal(p.team === a.task.team, compatible.some((c) => c.team === a.task.team), `seed ${seed}: team rule on ${a.task_id}`);
    }
  }
});

// ---------------------------------------------------------------- task editor validation
test("validateTask: name is required, trimmed, at most 60 characters", () => {
  const base = { team: "AF", theme: "e3dc", devices: ["desktop"] };
  equal(validateTask({ ...base, what: "" }).ok, false, "empty");
  equal(validateTask({ ...base, what: "   " }).errors.what, "Give the task a name.", "blank");
  equal(validateTask({ ...base, what: "  Smoke  " }).value.what, "Smoke", "trimmed");
  equal(validateTask({ ...base, what: "x".repeat(60) }).ok, true, "60");
  equal(validateTask({ ...base, what: "x".repeat(61) }).ok, false, "61");
  equal(validateTask({ ...base, what: "a\u0007b" }).ok, false, "control char");
});

test("validateTask: team is one team or all teams; theme and at least one device are required", () => {
  const base = { what: "T", theme: "flow", devices: ["ios"] };
  equal(validateTask({ ...base, team: "" }).value.team, null, "'' = all teams");
  equal(validateTask({ ...base, team: null }).value.team, null, "null = all teams");
  equal(validateTask({ ...base, team: "PB" }).value.team, "PB", "one team");
  equal(validateTask({ ...base, team: "XX" }).ok, false, "unknown team");
  equal(validateTask({ ...base, team: "AF", theme: "neon" }).ok, false, "unknown theme");
  const noDevice = validateTask({ ...base, team: "AF", devices: [] });
  equal(noDevice.ok, false, "no device");
  assert(noDevice.errors.devices, "devices error");
  equal(validateTask({ ...base, team: "AF", devices: ["tablet"] }).ok, false, "only unknown devices");
});

test("validateTask: options are deduplicated, unknown values dropped, kept in option order", () => {
  const r = validateTask({
    what: "T", team: "AF", theme: "e3dc",
    devices: ["ios", "desktop", "ios", "tablet"], browsers: ["firefox", "chrome", "opera"], users: ["service", "owner", 3]
  });
  equal(r.value, { what: "T", theme: "e3dc", team: "AF", devices: ["desktop", "ios"], browsers: ["chrome", "firefox"], users: ["owner", "service"] }, "clean");
  equal(validateTask({ what: "T", team: "AF", theme: "e3dc", devices: ["android"] }).value.browsers, [], "browsers optional");
  const mac = { what: "T", team: "AF", theme: "e3dc", browsers: ["chrome"] };
  equal(validateTask({ ...mac, devices: ["mac"] }).value.browsers, [], "Mac only: Safari, no browser");
  equal(validateTask({ ...mac, devices: ["desktop", "mac"] }).value.browsers, ["chrome"], "Desktop + Mac keeps the browsers");
});

test("validateTask keep: values the task already had survive an edit, new unknown ones don't", () => {
  const original = { id: "x", what: "T", theme: "neon", team: "QA", devices: ["desktop"], browsers: ["opera", "chrome"], users: ["admin"] };
  const input = { what: "T2", team: "QA", theme: "neon", devices: ["desktop"], browsers: ["chrome", "opera", "brave"], users: ["admin", "owner"] };
  equal(validateTask(input).ok, false, "without keep: unknown team/theme rejected");
  const r = validateTask(input, { keep: original });
  equal(r.value, { what: "T2", theme: "neon", team: "QA", devices: ["desktop"], browsers: ["chrome", "opera"], users: ["owner", "admin"] }, "kept, 'brave' dropped");
  equal(validateTask({ ...input, team: "Other" }, { keep: original }).ok, false, "a different unknown team is still rejected");
});

test("normalizeTask drops duplicate list entries (so old rooms stay editable)", () => {
  equal(normalizeTask({ id: "x", what: "W", theme: "flow", team: null, devices: ["ios", "ios"], browsers: ["edge", "edge"], users: ["owner", "owner"] }).users, ["owner"], "users");
  equal(normalizeTask({ id: "x", what: "W", theme: "flow", team: null, devices: ["ios", "ios"], browsers: [], users: [] }).devices, ["ios"], "devices");
});

test("validateTaskList: 1 to 50 tasks with unique ids", () => {
  equal(validateTaskList([]).ok, false, "empty");
  equal(validateTaskList([task("a", ["desktop"])]).ok, true, "one");
  equal(validateTaskList(Array.from({ length: 50 }, (_, i) => task(`t${i}`, ["desktop"]))).ok, true, "50");
  equal(validateTaskList(Array.from({ length: 51 }, (_, i) => task(`t${i}`, ["desktop"]))).ok, false, "51");
  equal(validateTaskList([task("a", ["desktop"]), task("a", ["ios"])]).ok, false, "duplicate ids");
});

test("newTaskId never collides, even with a broken random source", () => {
  const ids = new Set(TASKS.map((t) => t.id));
  const random = seededRandom(5);
  for (let i = 0; i < 200; i += 1) {
    const id = newTaskId(ids, random);
    assert(!ids.has(id) && /^task-[a-z0-9]+$/.test(id), `fresh id ${id}`);
    ids.add(id);
  }
  const stuck = new Set();
  for (let i = 0; i < 5; i += 1) stuck.add(newTaskId(stuck, () => 0));
  equal(stuck.size, 5, "constant random still gives unique ids");
});

test("tasksEditable: only in the lobby before the first spin", () => {
  equal(tasksEditable({ status: "lobby", spins_used: 0 }), true, "lobby");
  equal(tasksEditable({ status: "spun", spins_used: 1 }), false, "spun");
  equal(tasksEditable({ status: "final", spins_used: 2 }), false, "final");
});

// ---------------------------------------------------------------- compatibility
test("canReceiveTask: no phone → desktop yes, mobile no", () => {
  const p = person("Desk", "AF");
  assert(DESKTOP.every((t) => canReceiveTask(t, p)), "desktop");
  assert(MOBILE.every((t) => !canReceiveTask(t, p)), "mobile");
});

test("a participant with no phone receives desktop tasks and never mobile tasks", () => {
  for (let seed = 1; seed <= 50; seed += 1) {
    const noPhone = person("NoPhone", "AF");
    const phone = person("Phone", "PB", { android: true });
    const r = assignTasks(TASKS, [noPhone, phone], seededRandom(seed));
    assert(r.ok, "spin ok");
    const mine = assignedTo(r, noPhone.user_id);
    assert(mine.length > 0, "gets some tasks");
    assert(mine.every((a) => !isMobile(a.task)), `seed ${seed}: no-phone got a mobile task`);
  }
  // Alone without a phone: every desktop task, zero mobile tasks.
  const alone = person("Alone", "CYD");
  const r = assignTasks(TASKS, [alone], seededRandom(7));
  equal(assignedTo(r, alone.user_id).length, DESKTOP.length, "all desktop tasks");
  assert(assignedTo(r, alone.user_id).every((a) => !isMobile(a.task)), "desktop only");
});

test("Android-only, iOS-only and both-device participants can all receive mobile tasks", () => {
  for (const devices of [{ android: true }, { ios: true }, { android: true, ios: true }]) {
    const p = person("Mobile", "AF", devices);
    assert(MOBILE.every((t) => canReceiveTask(t, p)), `canReceiveTask ${JSON.stringify(devices)}`);
    const r = assignTasks(TASKS, [p], seededRandom(3));
    equal(assignedTo(r, p.user_id).filter((a) => isMobile(a.task)).length, MOBILE.length, `all mobile for ${JSON.stringify(devices)}`);
    equal(r.assignments.filter((a) => a.participant_id === null).length, 0, "nothing unassigned");
  }
});

// ---------------------------------------------------------------- online
test("offline participants receive nothing", () => {
  const on = person("On", "AF", { ios: true });
  const off1 = person("Off1", "AF", { android: true, online: false });
  const off2 = person("Off2", "PB", { android: true, ios: true, online: false });
  const r = assignTasks(TASKS, [on, off1, off2], seededRandom(11));
  equal(assignedTo(r, off1.user_id).length, 0, "off1");
  equal(assignedTo(r, off2.user_id).length, 0, "off2");
  equal(assignedTo(r, on.user_id).length, 16, "online person gets everything");
});

test("participants without online === true are treated as offline", () => {
  const p = person("Maybe", "AF", { android: true });
  delete p.online;
  const r = assignTasks(TASKS, [p], seededRandom(1));
  equal(r.ok, false, "no explicit online flag means offline");
});

test("zero online participants returns an error and no assignments", () => {
  const r1 = assignTasks(TASKS, [], seededRandom(1));
  equal(r1.ok, false, "empty roster");
  assert(typeof r1.error === "string" && r1.error.length > 0, "error message");
  equal(r1.assignments.length, 0, "no assignments");
  const r2 = assignTasks(TASKS, [person("Off", "AF", { online: false, android: true })], seededRandom(1));
  equal(r2.ok, false, "only offline people");
});

// ---------------------------------------------------------------- team preference
test("each team task goes to its own team when a compatible member is online", () => {
  for (let seed = 1; seed <= 50; seed += 1) {
    const roster = [
      person("A1", "AF", { android: true }), person("A2", "AF"),
      person("C1", "CYD", { ios: true }),
      person("P1", "PB", { android: true, ios: true }), person("P2", "PB")
    ];
    const people = byId(roster);
    const r = assignTasks(TASKS, roster, seededRandom(seed));
    for (const a of r.assignments.filter((x) => x.task.team)) {
      equal(people.get(a.participant_id).team, a.task.team, `seed ${seed}: ${a.task_id}`);
      equal(a.team_match, true, `team_match for ${a.task_id}`);
    }
  }
});

test("a team task goes cross-team only when no compatible member of that team is online", () => {
  for (let seed = 1; seed <= 50; seed += 1) {
    const afDesk = person("AFdesk", "AF");                       // AF, no phone
    const afPhoneOff = person("AFoff", "AF", { android: true, online: false });
    const pb = person("PB", "PB", { ios: true });
    // nobody from CYD online at all
    const roster = [afDesk, afPhoneOff, pb];
    const people = byId(roster);
    const r = assignTasks(TASKS, roster, seededRandom(seed));
    for (const a of r.assignments) {
      if (a.task.team === "AF" && !isMobile(a.task)) {
        equal(a.participant_id, afDesk.user_id, `AF desktop stays in AF (${a.task_id})`);
        equal(a.team_match, true, "match");
      }
      if (a.task.team === "AF" && isMobile(a.task)) {
        equal(a.participant_id, pb.user_id, `AF mobile crosses to the only phone owner (${a.task_id})`);
        equal(a.team_match, false, "cross-team flagged");
      }
      if (a.task.team === "CYD") {
        assert(a.participant_id !== null, "CYD task assigned");
        equal(a.team_match, false, "CYD tasks are cross-team");
      }
      if (a.task.team === "PB") equal(people.get(a.participant_id).team, "PB", "PB stays in PB");
    }
  }
});

test("team preference never overrides the phone rule", () => {
  for (let seed = 1; seed <= 50; seed += 1) {
    const af = person("AFnoPhone", "AF");
    const cyd = person("CYDphone", "CYD", { android: true });
    const r = assignTasks(TASKS, [af, cyd], seededRandom(seed));
    for (const a of r.assignments.filter((x) => x.task.team === "AF" && isMobile(x.task))) {
      equal(a.participant_id, cyd.user_id, `seed ${seed}: ${a.task_id} must go to a phone owner`);
    }
    assert(assignedTo(r, af.user_id).every((a) => !isMobile(a.task)), "AF member got a mobile task");
  }
});

test("neutral tasks record team_match as null", () => {
  const r = assignTasks(TASKS, [person("X", "AF", { ios: true })], seededRandom(5));
  for (const a of r.assignments.filter((x) => x.task.team === null)) equal(a.team_match, null, a.task_id);
});

// ---------------------------------------------------------------- unassigned
test("a mobile task with no phone owner online is Unassigned and the spin still succeeds", () => {
  const desk1 = person("D1", "AF"), desk2 = person("D2", "PB");
  const phoneOffline = person("Off", "CYD", { android: true, online: false });
  const r = assignTasks(TASKS, [desk1, desk2, phoneOffline], seededRandom(9));
  equal(r.ok, true, "spin succeeds");
  const unassigned = r.assignments.filter((a) => a.participant_id === null);
  equal(unassigned.length, MOBILE.length, "every mobile task unassigned");
  assert(unassigned.every((a) => isMobile(a.task)), "only mobile tasks are unassigned");
  assert(unassigned.every((a) => a.reason === UNASSIGNED_NO_PHONE && a.participant === null && a.team_match === null), "reason and empty fields");
  assert(r.assignments.filter((a) => !isMobile(a.task)).every((a) => a.participant_id !== null), "desktop all assigned");
});

// ---------------------------------------------------------------- completeness
test("every task appears exactly once in the result, in task order", () => {
  for (let seed = 1; seed <= 100; seed += 1) {
    const random = seededRandom(seed);
    const roster = randomRoster(random);
    if (!roster.some((p) => p.online)) roster[0].online = true;
    const r = assignTasks(TASKS, roster, random);
    equal(r.assignments.length, TASKS.length, "length");
    equal(r.assignments.map((a) => a.task_id), TASKS.map((t) => t.id), `seed ${seed}: order/ids`);
  }
});

// ---------------------------------------------------------------- load balancing
test("load within a pool differs by at most one (everyone shares one pool)", () => {
  for (let seed = 1; seed <= 100; seed += 1) {
    const roster = [1, 2, 3, 4].map((i) => person(`S${i}`, "AF", { android: true }));
    const counts = [...loads(assignTasks(TASKS, roster, seededRandom(seed)), roster).values()];
    assert(Math.max(...counts) - Math.min(...counts) <= 1, `seed ${seed}: ${counts}`);
    equal(counts.reduce((s, n) => s + n, 0), 16, "total");
  }
});

test("people with identical team and devices always end within one task of each other", () => {
  // Same team + same phone capability ⇒ they are in exactly the same pools.
  for (let seed = 1; seed <= 300; seed += 1) {
    const random = seededRandom(seed * 7919);
    const roster = randomRoster(random);
    if (!roster.some((p) => p.online)) roster[0].online = true;
    const r = assignTasks(TASKS, roster, random);
    const count = loads(r, roster);
    const groups = new Map();
    for (const p of roster.filter((x) => x.online)) {
      const key = `${p.team}|${Boolean(p.android || p.ios)}`;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(count.get(p.user_id));
    }
    for (const [key, values] of groups) {
      assert(Math.max(...values) - Math.min(...values) <= 1, `seed ${seed}, group ${key}: ${values}`);
    }
  }
});

test("documented caveat: a team with one member online receives all of that team's tasks", () => {
  const soloAF = person("SoloAF", "AF", { android: true });
  const pbs = [1, 2, 3].map((i) => person(`PB${i}`, "PB", { ios: true }));
  const r = assignTasks(TASKS, [soloAF, ...pbs], seededRandom(21));
  const afTasks = r.assignments.filter((a) => a.task.team === "AF");
  assert(afTasks.length === 4 && afTasks.every((a) => a.participant_id === soloAF.user_id), "all AF tasks to the solo member");
});

// ---------------------------------------------------------------- determinism
test("the same seeded random source gives the same result", () => {
  const roster = [
    person("A", "AF", { android: true }), person("B", "AF"), person("C", "CYD", { ios: true }),
    person("D", "PB"), person("E", "PB", { android: true, ios: true })
  ];
  const r1 = assignTasks(TASKS, roster, seededRandom(1234));
  const r2 = assignTasks(TASKS, roster, seededRandom(1234));
  equal(r1, r2, "identical output");
  const differs = [1, 2, 3, 4, 5].some((s) => JSON.stringify(assignTasks(TASKS, roster, seededRandom(s))) !== JSON.stringify(r1));
  assert(differs, "different seeds should be able to produce different results");
});

test("assignTasks does not mutate its inputs", () => {
  const tasks = deepFreeze(JSON.parse(JSON.stringify(TASKS)));
  const roster = deepFreeze([person("A", "AF", { android: true }), person("B", "PB")]);
  const r = assignTasks(tasks, roster, seededRandom(2)); // throws in strict mode if it mutates
  equal(r.ok, true, "ok");
});

test("shuffle is a permutation and is deterministic for a seed", () => {
  const items = Array.from({ length: 30 }, (_, i) => i);
  const a = shuffle(items, seededRandom(99));
  equal([...a].sort((x, y) => x - y), items, "permutation");
  equal(shuffle(items, seededRandom(99)), a, "deterministic");
  equal(items, Array.from({ length: 30 }, (_, i) => i), "input untouched");
});

test("random sources returning edge values (0, 0.9999999, 1) never break assignment", () => {
  const roster = [person("A", "AF", { android: true }), person("B", "AF", { ios: true })];
  for (const value of [0, 0.9999999, 1]) {
    const r = assignTasks(TASKS, roster, () => value);
    equal(r.assignments.filter((a) => a.participant_id).length, 16, `random() = ${value}`);
  }
});

// ---------------------------------------------------------------- property check
test("property check over 500 random rosters: phone rule, team rule, offline rule", () => {
  for (let seed = 1; seed <= 500; seed += 1) {
    const random = seededRandom(seed);
    const roster = randomRoster(random);
    const r = assignTasks(TASKS, roster, random);
    const online = roster.filter((p) => p.online);
    if (online.length === 0) { equal(r.ok, false, `seed ${seed} empty`); continue; }
    const people = byId(roster);
    for (const a of r.assignments) {
      const compatible = online.filter((p) => canReceiveTask(a.task, p));
      if (a.participant_id === null) {
        equal(compatible.length, 0, `seed ${seed}: ${a.task_id} unassigned while someone could take it`);
        continue;
      }
      const p = people.get(a.participant_id);
      assert(p.online, `seed ${seed}: offline person assigned`);
      assert(canReceiveTask(a.task, p), `seed ${seed}: phone rule broken on ${a.task_id}`);
      if (a.task.team) {
        const ownTeamAvailable = compatible.some((c) => c.team === a.task.team);
        equal(p.team === a.task.team, ownTeamAvailable, `seed ${seed}: team rule on ${a.task_id}`);
        equal(a.team_match, p.team === a.task.team, "team_match value");
      }
      equal(a.participant.name, p.name, "participant snapshot");
    }
  }
});

// ---------------------------------------------------------------- profile validation
test("profile validation: name is required, trimmed and 1–40 characters", () => {
  const base = { team: "AF", android: false, ios: false };
  equal(validateProfile({ ...base, name: "" }).ok, false, "empty");
  equal(validateProfile({ ...base, name: "    " }).ok, false, "whitespace only");
  equal(validateProfile({ ...base, name: undefined }).ok, false, "missing");
  equal(validateProfile({ ...base, name: "  Ada  " }).value.name, "Ada", "trimmed");
  equal(validateProfile({ ...base, name: "a" }).ok, true, "1 char");
  equal(validateProfile({ ...base, name: "x".repeat(40) }).ok, true, "40 chars");
  equal(validateProfile({ ...base, name: "x".repeat(41) }).ok, false, "41 chars");
  equal(validateProfile({ ...base, name: "  " + "x".repeat(40) + "  " }).ok, true, "40 chars after trimming");
  equal(validateProfile({ ...base, name: "😀".repeat(40) }).ok, true, "40 emoji count as 40 characters");
  equal(validateProfile({ ...base, name: "😀".repeat(41) }).ok, false, "41 emoji");
  equal(validateProfile({ ...base, name: "Ada\u0007" }).ok, false, "control character");
});

test("profile validation: team must be exactly AF, CYD or PB", () => {
  for (const team of ["AF", "CYD", "PB"]) equal(validateProfile({ name: "Ada", team }).ok, true, team);
  for (const team of ["af", "CD", "XX", "", null, undefined, 1]) {
    const r = validateProfile({ name: "Ada", team });
    equal(r.ok, false, `team ${JSON.stringify(team)}`);
    assert(r.errors.team, "team error message");
  }
});

test("profile validation: devices are strict booleans, neither is valid", () => {
  equal(validateProfile({ name: "Ada", team: "PB" }).value, { name: "Ada", team: "PB", android: false, ios: false }, "neither");
  equal(validateProfile({ name: "Ada", team: "PB", android: true, ios: true }).value, { name: "Ada", team: "PB", android: true, ios: true }, "both");
  equal(validateProfile({ name: "Ada", team: "PB", android: "yes", ios: 1 }).value, { name: "Ada", team: "PB", android: false, ios: false }, "non-booleans ignored");
});

// ---------------------------------------------------------------- room code
test("room codes are normalized and lookalike characters are rejected", () => {
  equal(normalizeRoomCode(" abc234 "), "ABC234", "trim + uppercase");
  for (const bad of ["ABC23", "ABC2345", "ABCD0O", "ABCD1I", "ABCDEL", "ABC-23", "", null, 123456]) {
    equal(normalizeRoomCode(bad), null, `rejects ${JSON.stringify(bad)}`);
  }
  for (const ch of "0O1IL") assert(!ROOM_CODE_ALPHABET.includes(ch), `alphabet excludes ${ch}`);
});

// ---------------------------------------------------------------- spin rules
test("spinRule: first spin, second spin gate at the threshold, then final", () => {
  equal(spinRule({ status: "lobby", spins_used: 0 }, 0, 2), { spinNumber: 1, allowed: true, reason: null }, "lobby");
  equal(spinRule({ status: "spun", spins_used: 1 }, 0, 2).allowed, false, "0 complaints");
  equal(spinRule({ status: "spun", spins_used: 1 }, 1, 2).allowed, false, "1 complaint");
  equal(spinRule({ status: "spun", spins_used: 1 }, 2, 2), { spinNumber: 2, allowed: true, reason: null }, "2 complaints");
  equal(spinRule({ status: "spun", spins_used: 1 }, 3, 2).allowed, true, "3 complaints");
  equal(spinRule({ status: "final", spins_used: 2 }, 5, 2).allowed, false, "final");
});

// ---------------------------------------------------------------- report
const passed = results.filter((r) => r.ok).length;
const failed = results.length - passed;
const summary = document.getElementById("summary");
summary.textContent = `${passed} passed, ${failed} failed (${results.length} tests)`;
summary.className = failed ? "fail" : "pass";
const list = document.getElementById("results");
for (const r of results) {
  const li = document.createElement("li");
  const mark = document.createElement("span");
  mark.className = r.ok ? "pass" : "fail";
  mark.textContent = r.ok ? "✓ PASS " : "✗ FAIL ";
  li.append(mark, document.createTextNode(r.name));
  if (!r.ok) {
    const detail = document.createElement("span");
    detail.className = "detail";
    detail.textContent = r.error;
    li.append(detail);
  }
  list.append(li);
}
document.title = `${failed ? "FAIL" : "PASS"} ${passed}/${results.length} — WheelOfTest tests`;
window.__TEST_RESULTS__ = { passed, failed, results };
