<script type="module">
import {
  validateProfile, normalizeRoomCode, canReceiveTask, assignTasks,
  seededRandom, shuffle, spinRule, UNASSIGNED_NO_PHONE, ROOM_CODE_ALPHABET,
  normalizeTask, taskPhones, unassignedReason, validateTask, validateTaskList,
  newTaskId, sameTaskList, isDefaultTaskList, tasksEditable,
  taskNeedsMac, taskBrowsers, UNASSIGNED_NO_MAC,
  withCriticalFlows, hasCriticalFlows, CRITICAL_FLOW_COUNT, peopleShortOfTasks, compatibleCount,
  normalizeAssignment, ownerIds, isOwner, tasksOf, suggestOwner, validateTasksPerPerson, validateLinks, canJoinTask, canLeaveTask,
  takeoversOpen, canRequestTakeover, canResolveTakeover, requestFor, pendingRequests, takeoverChanges
} from "./domain.js";
import { DEFAULT_TASKS as TASKS, defaultTasks, DEVICES, BROWSERS, MAC_BROWSER, USER_LEVELS, THEMES } from "./tasks.js";

// ---------------------------------------------------------------- tiny runner
const results = [];
function test(name, fn) {
  try { fn(); results.push({ name, ok: true }); }
  catch (error) { results.push({ name, ok: false, error: error && error.message ? error.message : String(error) }); }
}
function assert(condition, message) { if (!condition) throw new Error(message || "assertion failed"); }
function equal(actual, expected, message) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a !== e) throw new Error(`${message || "not equal"}\n  expected: ${e}\n  actual:   ${a}`);
}

// ---------------------------------------------------------------- fixtures
let nextId = 0;
function person(name, team, { mac = false, android = false, ios = false, online = true } = {}) {
  nextId += 1;
  return { user_id: `u-${String(nextId).padStart(3, "0")}-${name}`, name, team, mac, android, ios, online };
}
const isMobile = (task) => taskPhones(task).length > 0;   // needs a phone
const MOBILE = TASKS.filter(isMobile);
const MAC = TASKS.filter((t) => taskNeedsMac(t));
const DESKTOP = TASKS.filter((t) => !isMobile(t) && !taskNeedsMac(t));   // anyone can take these
const ALL_DEVICES = { mac: true, android: true, ios: true };

// Independent oracle: the most people that can get at least one task each (max flow / BFS
// augmenting paths), optionally only over "preferred" edges (own team or all-teams tasks).
function maxCover(tasks, people, edge = canReceiveTask) {
  const adj = people.map((p) => tasks.map((t, j) => (edge(t, p) ? j : -1)).filter((j) => j >= 0));
  const owner = new Array(tasks.length).fill(-1);
  let size = 0;
  for (let s = 0; s < people.length; s += 1) {
    const prevTask = new Map(), prevPerson = new Map([[s, -1]]);
    const queue = [s];
    let end = -1;
    while (queue.length && end < 0) {
      const p = queue.shift();
      for (const j of adj[p]) {
        if (prevTask.has(j)) continue;
        prevTask.set(j, p);
        if (owner[j] < 0) { end = j; break; }
        if (!prevPerson.has(owner[j])) { prevPerson.set(owner[j], j); queue.push(owner[j]); }
      }
    }
    if (end < 0) continue;
    size += 1;
    for (let j = end; j >= 0;) { const p = prevTask.get(j); const next = prevPerson.get(p); owner[j] = p; j = next; }
  }
  return size;
}
const preferredEdge = (t, p) => canReceiveTask(t, p) && (t.team == null || t.team === p.team);
// Tests written for one tester per task read the first (usually only) tester through these.
const holder = (a) => a.owners[0] ?? null;
const holderId = (a) => holder(a)?.user_id ?? null;
const teamMatch = (a) => holder(a)?.team_match ?? null;
const withTask = (result, people) => people.filter((p) => result.assignments.some((a) => isOwner(a, p.user_id)));
const byId = (list) => new Map(list.map((x) => [x.user_id, x]));
function assignedTo(result, userId) { return result.assignments.filter((a) => isOwner(a, userId)); }
function loads(result, people) {
  const m = new Map(people.map((p) => [p.user_id, 0]));
  for (const a of result.assignments) for (const id of ownerIds(a)) m.set(id, m.get(id) + 1);
  return m;
}
function deepFreeze(value) {
  if (value && typeof value === "object") { Object.values(value).forEach(deepFreeze); Object.freeze(value); }
  return value;
}
function randomRoster(random) {
  const teams = ["AF", "CYD", "PB"];
  const size = 1 + Math.floor(random() * 9);
  const roster = [];
  for (let i = 0; i < size; i += 1) {
    const device = Math.floor(random() * 4); // 0 none, 1 android, 2 ios, 3 both
    roster.push(person(`p${i}`, teams[Math.floor(random() * 3)], {
      android: device === 1 || device === 3,
      ios: device === 2 || device === 3,
      mac: random() < 0.3,
      online: random() < 0.8
    }));
  }
  return roster;
}

// ---------------------------------------------------------------- task data
test("tasks.js has the 32 default tasks: one per release, theme and device, no duplicates", () => {
  equal(TASKS.length, 32, "task count");
  equal(new Set(TASKS.map((t) => t.id)).size, 32, "unique ids");
  const values = (options) => options.map((o) => o.value);
  for (const t of TASKS) {
    assert(t.devices.length > 0 && t.devices.every((d) => values(DEVICES).includes(d)), `devices of ${t.id}`);
    assert(values(THEMES).includes(t.theme), `theme of ${t.id}`);
    assert(t.team === null || ["AF", "CYD", "PB"].includes(t.team), `team of ${t.id}`);
    equal(t.users, values(USER_LEVELS), `${t.id}: every user level`);
    equal(validateTask(t).ok, true, `${t.id} passes the editor's validation`);
    equal(t.devices.length, 1, `${t.id}: one device per task`);
  }
  const keys = TASKS.map((t) => `${t.what}|${t.theme}|${t.team}|${t.devices}`);
  equal(new Set(keys).size, 32, "no two defaults differ only by browser or user level");
  for (const what of ["Critical User Flows", "AF Release", "PB Release", "CD Release"]) {
    for (const theme of ["e3dc", "flow"]) {
      const devices = TASKS.filter((t) => t.what === what && t.theme === theme).map((t) => t.devices[0]);
      equal(devices, ["desktop", "mac", "android", "ios"], `${what} ${theme}: every device once`);
    }
  }
  equal(TASKS.filter((t) => t.what === "CD Release").every((t) => t.team === "CYD"), true, "CD Release belongs to CYD");
  equal([DESKTOP.length, MAC.length, MOBILE.length], [8, 8, 16], "desktop / mac / phone task counts");
  assert(MOBILE.every((t) => t.browsers.length === 0 && taskBrowsers(t).length === 0), "phone tasks: no browser");
  assert(MAC.every((t) => JSON.stringify(taskBrowsers(t)) === '["safari"]'), "Mac tasks: Safari");
  assert(DESKTOP.every((t) => JSON.stringify(t.devices) === '["desktop"]' && JSON.stringify(t.browsers) === JSON.stringify(values(BROWSERS))), "desktop = every browser");
  equal(values(BROWSERS), ["chrome", "edge", "firefox"], "Safari is not a browser option");
  equal(validateTaskList(TASKS).ok, true, "default list is valid");
});

// ---------------------------------------------------------------- defaults stay default
test("the defaults are frozen and defaultTasks() hands out independent copies", () => {
  assert(Object.isFrozen(TASKS) && TASKS.every((t) => Object.isFrozen(t) && Object.isFrozen(t.devices)), "deep-frozen");
  const a = defaultTasks();
  const b = defaultTasks();
  a[0].what = "Changed";
  a[1].devices.push("ios");
  a.splice(2, 1);
  equal(b, JSON.parse(JSON.stringify(TASKS)), "a second copy is untouched");
  equal(TASKS[0].what, "Critical User Flows", "the defaults are untouched");
  equal(isDefaultTaskList(b), true, "fresh copy is the default set");
  equal(isDefaultTaskList(a), false, "edited copy is not");
});

test("sameTaskList compares fields and order, not key order or legacy shape", () => {
  const reordered = TASKS.map((t) => ({ users: t.users, browsers: t.browsers, devices: t.devices, team: t.team, theme: t.theme, what: t.what, id: t.id }));
  equal(sameTaskList(reordered, TASKS), true, "key order ignored");
  equal(sameTaskList([...TASKS].reverse(), TASKS), false, "order matters");
  equal(sameTaskList(TASKS.slice(1), TASKS), false, "length matters");
});

// ---------------------------------------------------------------- legacy rooms
// Rooms created before tasks were editable stored { device, platform } instead of { devices, browsers }.
// These are the original 22 tasks exactly as that version stored them.
const L = (id, what, theme, device, team, users) =>
  ({ id, what, theme, device, platform: device === "mobile" ? "mobile" : "desktop", team, users });
const LEGACY = [
  L("cuf-e3dc-edge", "Critical User Flows", "e3dc", "edge", null, ["owner", "installer", "partner", "service"]),
  L("cuf-flow-firefox", "Critical User Flows", "flow", "firefox", null, ["owner", "installer", "service"]),
  L("cuf-e3dc-mobile", "Critical User Flows", "e3dc", "mobile", null, ["owner", "installer", "partner", "service"]),
  L("cuf-flow-mobile", "Critical User Flows", "flow", "mobile", null, ["owner", "installer", "service"]),
  ...[["af", "AF Release", "AF"], ["pb", "PB Release", "PB"], ["cyd", "CD Release", "CYD"]].flatMap(([p, what, team]) => [
    L(`${p}-e3dc-mobile`, what, "e3dc", "mobile", team, ["owner"]),
    L(`${p}-e3dc-chrome`, what, "e3dc", "chrome", team, ["installer", "partner"]),
    L(`${p}-e3dc-edge`, what, "e3dc", "edge", team, ["service"]),
    L(`${p}-flow-mobile`, what, "flow", "mobile", team, ["owner"]),
    L(`${p}-flow-firefox`, what, "flow", "firefox", team, ["installer"]),
    L(`${p}-flow-edge`, what, "flow", "edge", team, ["service"])
  ])
];

test("normalizeTask converts the original 22 legacy tasks: mobile → Android + iOS, desktop → its one browser", () => {
  equal(LEGACY.length, 22, "fixture");
  for (const old of LEGACY) {
    const t = normalizeTask(old);
    if (old.platform === "mobile") {
      equal([t.devices, t.browsers], [["android", "ios"], []], old.id);
    } else {
      equal([t.devices, t.browsers], [["desktop"], [old.device]], old.id);
    }
    equal([t.id, t.what, t.theme, t.team, t.users], [old.id, old.what, old.theme, old.team, old.users], `${old.id} other fields`);
    assert(!taskNeedsMac(t), `${old.id}: never needs a Mac`);
  }
  equal(normalizeTask(TASKS[3]), JSON.parse(JSON.stringify(TASKS[3])), "current shape passes through");
  equal(normalizeTask({ id: "x", what: "W", theme: "flow", team: "AF", devices: ["ios"], browsers: ["safari"], users: [], extra: 1 }),
    { id: "x", what: "W", theme: "flow", team: "AF", devices: ["ios"], browsers: ["safari"], users: [] }, "unknown fields dropped");
});

test("legacy tasks assign exactly like their converted form (old rooms behave as before)", () => {
  const roster = [person("A", "AF", { android: true }), person("B", "PB"), person("C", "CYD", { ios: true }), person("D", "AF", { mac: true })];
  for (let seed = 1; seed <= 40; seed += 1) {
    const converted = assignTasks(LEGACY.map(normalizeTask), roster, seededRandom(seed));
    const old = assignTasks(LEGACY, roster, seededRandom(seed));
    equal(old, converted, `seed ${seed}`);
  }
});

// ---------------------------------------------------------------- devices per task
const task = (id, devices, team = null) => ({ id, what: `T ${id}`, theme: "e3dc", team, devices, browsers: [], users: [] });

test("canReceiveTask follows the task's devices: phones are not interchangeable", () => {
  const none = person("None", "AF"), droid = person("Droid", "AF", { android: true });
  const iphone = person("Iphone", "AF", { ios: true }), both = person("Both", "AF", { android: true, ios: true });
  const cases = [
    [["desktop"], [true, true, true, true]],
    [["android"], [false, true, false, true]],
    [["ios"], [false, false, true, true]],
    [["android", "ios"], [false, true, true, true]],
    [["desktop", "ios"], [false, false, true, true]],
    [["desktop", "android", "ios"], [false, true, true, true]]
  ];
  for (const [devices, expected] of cases) {
    equal([none, droid, iphone, both].map((p) => canReceiveTask(task("x", devices), p)), expected, JSON.stringify(devices));
  }
});

test("canReceiveTask: a Mac task needs a Mac; Mac + phone needs both", () => {
  const none = person("None", "AF"), mac = person("Mac", "AF", { mac: true });
  const macIos = person("MacIos", "AF", { mac: true, ios: true }), ios = person("Ios", "AF", { ios: true });
  const cases = [
    [["mac"], [false, true, true, false]],
    [["desktop", "mac"], [false, true, true, false]],
    [["mac", "ios"], [false, false, true, false]],
    [["mac", "android", "ios"], [false, false, true, false]],
    [["desktop"], [true, true, true, true]]
  ];
  for (const [devices, expected] of cases) {
    equal([none, mac, macIos, ios].map((p) => canReceiveTask(task("x", devices), p)), expected, JSON.stringify(devices));
  }
  assert(!canReceiveTask(task("x", ["mac"]), { ...mac, mac: undefined }), "missing mac flag (old participant) = no Mac");
});

test("taskBrowsers: chosen browsers on Desktop, Safari on Mac, none for phones", () => {
  const t = (devices, browsers) => ({ ...task("x", devices), browsers });
  equal(taskBrowsers(t(["desktop"], ["chrome", "edge", "firefox"])), ["chrome", "edge", "firefox"], "desktop");
  equal(taskBrowsers(t(["mac"], [])), [MAC_BROWSER.value], "mac → safari");
  equal(taskBrowsers(t(["desktop", "mac"], ["chrome"])), ["chrome", "safari"], "both");
  equal(taskBrowsers(t(["android", "ios"], ["chrome"])), [], "browsers ignored without Desktop");
});

test("unassigned reasons name the Mac and/or phones the task needs", () => {
  equal(unassignedReason(task("a", ["mac"])), UNASSIGNED_NO_MAC, "mac");
  equal(unassignedReason(task("b", ["desktop", "mac"])), "No one online has a Mac.", "desktop + mac");
  equal(unassignedReason(task("c", ["mac", "ios"])), "No one online has a Mac and an iOS phone.", "mac + ios");
  equal(unassignedReason(task("d", ["mac", "ios", "android"])), "No one online has a Mac and an Android or iOS phone.", "mac + both");
  const r = assignTasks([task("m", ["mac"]), task("d", ["desktop"])], [person("P", "AF", { ios: true })], seededRandom(2));
  equal(holderId(r.assignments[0]), null, "mac task unassigned");
  equal(r.assignments[0].reason, UNASSIGNED_NO_MAC, "reason");
  equal(holderId(r.assignments[1]) !== null, true, "desktop task assigned");
});

test("an Android-only task with only iOS people online is Unassigned with an Android reason", () => {
  const tasks = [task("droid", ["android"]), task("apple", ["ios"]), task("any", ["android", "ios"]), task("desk", ["desktop"])];
  const r = assignTasks(tasks, [person("I", "AF", { ios: true }), person("D", "PB")], seededRandom(4));
  const by = new Map(r.assignments.map((a) => [a.task_id, a]));
  equal(holderId(by.get("droid")), null, "android task unassigned");
  equal(by.get("droid").reason, "No one online has an Android phone.", "reason");
  assert(holder(by.get("apple")).ios, "iOS task to the iPhone owner");
  assert(holder(by.get("any")).ios, "either-phone task to the iPhone owner");
  assert(holderId(by.get("desk")) !== null, "desktop task assigned");
});

test("unassignedReason names the phones the task needs", () => {
  equal(unassignedReason(task("a", ["android"])), "No one online has an Android phone.", "android");
  equal(unassignedReason(task("b", ["ios", "desktop"])), "No one online has an iOS phone.", "ios");
  equal(unassignedReason(task("c", ["ios", "android"])), UNASSIGNED_NO_PHONE, "both, in fixed order");
  equal(unassignedReason(LEGACY[2]), UNASSIGNED_NO_PHONE, "legacy mobile");
});

test("property check over 500 random custom task lists: device rule, team rule, completeness", () => {
  const all = ["desktop", "mac", "android", "ios"];
  const teams = ["AF", "CYD", "PB", null];
  for (let seed = 1; seed <= 500; seed += 1) {
    const random = seededRandom(seed * 31);
    const roster = randomRoster(random);
    const n = 1 + Math.floor(random() * 30);
    const tasks = Array.from({ length: n }, (_, i) => {
      let devices = all.filter(() => random() < 0.5);
      if (devices.length === 0) devices = [all[Math.floor(random() * 4)]];
      return task(`t${i}`, devices, teams[Math.floor(random() * 4)]);
    });
    const r = assignTasks(tasks, roster, random);
    const online = roster.filter((p) => p.online);
    if (online.length === 0) { equal(r.ok, false, `seed ${seed} empty`); continue; }
    equal(r.assignments.map((a) => a.task_id), tasks.map((t) => t.id), `seed ${seed}: every task once, in order`);
    equal(withTask(r, online).length, online.filter((p) => compatibleCount(tasks, p) > 0).length, `seed ${seed}: everyone who can take a task gets one`);
    // Team preference is strict whenever everyone can get a task within their own team
    const keepsTeams = maxCover(tasks, online, preferredEdge) === online.length;
    const people = byId(roster);
    for (const a of r.assignments) {
      const compatible = online.filter((p) => canReceiveTask(a.task, p));
      if (holderId(a) === null) {
        equal(compatible.length, 0, `seed ${seed}: ${a.task_id} unassigned while someone could take it`);
        equal(a.reason, unassignedReason(a.task), "reason");
        continue;
      }
      const p = people.get(holderId(a));
      assert(p.online && canReceiveTask(a.task, p), `seed ${seed}: device rule broken on ${a.task_id}`);
      if (a.task.team && keepsTeams) equal(p.team === a.task.team, compatible.some((c) => c.team === a.task.team), `seed ${seed}: team rule on ${a.task_id}`);
    }
  }
});

// ---------------------------------------------------------------- task editor validation
test("validateTask: name is required, trimmed, at most 60 characters", () => {
  const base = { team: "AF", theme: "e3dc", devices: ["desktop"] };
  equal(validateTask({ ...base, what: "" }).ok, false, "empty");
  equal(validateTask({ ...base, what: "   " }).errors.what, "Give the task a name.", "blank");
  equal(validateTask({ ...base, what: "  Smoke  " }).value.what, "Smoke", "trimmed");
  equal(validateTask({ ...base, what: "x".repeat(60) }).ok, true, "60");
  equal(validateTask({ ...base, what: "x".repeat(61) }).ok, false, "61");
  equal(validateTask({ ...base, what: "a\u0007b" }).ok, false, "control char");
});

test("validateTask: team is one team or all teams; theme and at least one device are required", () => {
  const base = { what: "T", theme: "flow", devices: ["ios"] };
  equal(validateTask({ ...base, team: "" }).value.team, null, "'' = all teams");
  equal(validateTask({ ...base, team: null }).value.team, null, "null = all teams");
  equal(validateTask({ ...base, team: "PB" }).value.team, "PB", "one team");
  equal(validateTask({ ...base, team: "XX" }).ok, false, "unknown team");
  equal(validateTask({ ...base, team: "AF", theme: "neon" }).ok, false, "unknown theme");
  const noDevice = validateTask({ ...base, team: "AF", devices: [] });
  equal(noDevice.ok, false, "no device");
  assert(noDevice.errors.devices, "devices error");
  equal(validateTask({ ...base, team: "AF", devices: ["tablet"] }).ok, false, "only unknown devices");
});

test("validateTask: options are deduplicated, unknown values dropped, kept in option order", () => {
  const r = validateTask({
    what: "T", team: "AF", theme: "e3dc",
    devices: ["ios", "desktop", "ios", "tablet"], browsers: ["safari", "firefox", "chrome", "opera"], users: ["service", "owner", 3]
  });
  equal(r.value, { what: "T", theme: "e3dc", team: "AF", devices: ["desktop", "ios"], browsers: ["chrome", "firefox"], users: ["owner", "service"] }, "clean; Safari is not an option");
  equal(validateTask({ what: "T", team: "AF", theme: "e3dc", devices: ["android"] }).value.browsers, [], "browsers optional");
});

test("validateTask: browsers only apply to Desktop; Mac is a device", () => {
  const base = { what: "T", team: "AF", theme: "e3dc", browsers: ["chrome", "edge"], users: [] };
  equal(validateTask({ ...base, devices: ["mac"] }).value.browsers, [], "Mac only: browsers dropped (Safari is implied)");
  equal(validateTask({ ...base, devices: ["android", "ios"] }).value.browsers, [], "phones only: browsers dropped");
  equal(validateTask({ ...base, devices: ["mac", "desktop"] }).value,
    { what: "T", theme: "e3dc", team: "AF", devices: ["desktop", "mac"], browsers: ["chrome", "edge"], users: [] }, "Desktop + Mac keeps the Desktop browsers");
});

test("validateProfile: Mac is a strict boolean like the phones; Desktop is implied", () => {
  equal(validateProfile({ name: "Ada", team: "AF", mac: true }).value, { name: "Ada", team: "AF", mac: true, android: false, ios: false }, "mac");
  equal(validateProfile({ name: "Ada", team: "AF", mac: "yes" }).value.mac, false, "non-boolean ignored");
});

test("validateTask keep: values the task already had survive an edit, new unknown ones don't", () => {
  const original = { id: "x", what: "T", theme: "neon", team: "QA", devices: ["desktop"], browsers: ["opera", "chrome"], users: ["admin"] };
  const input = { what: "T2", team: "QA", theme: "neon", devices: ["desktop"], browsers: ["chrome", "opera", "brave"], users: ["admin", "owner"] };
  equal(validateTask(input).ok, false, "without keep: unknown team/theme rejected");
  const r = validateTask(input, { keep: original });
  equal(r.value, { what: "T2", theme: "neon", team: "QA", devices: ["desktop"], browsers: ["chrome", "opera"], users: ["owner", "admin"] }, "kept, 'brave' dropped");
  equal(validateTask({ ...input, team: "Other" }, { keep: original }).ok, false, "a different unknown team is still rejected");
});

test("normalizeTask drops duplicate list entries (so old rooms stay editable)", () => {
  equal(normalizeTask({ id: "x", what: "W", theme: "flow", team: null, devices: ["ios", "ios"], browsers: ["edge", "edge"], users: ["owner", "owner"] }).users, ["owner"], "users");
  equal(normalizeTask({ id: "x", what: "W", theme: "flow", team: null, devices: ["ios", "ios"], browsers: [], users: [] }).devices, ["ios"], "devices");
});

test("validateTaskList: 1 to 50 tasks with unique ids", () => {
  equal(validateTaskList([]).ok, false, "empty");
  equal(validateTaskList([task("a", ["desktop"])]).ok, true, "one");
  equal(validateTaskList(Array.from({ length: 50 }, (_, i) => task(`t${i}`, ["desktop"]))).ok, true, "50");
  equal(validateTaskList(Array.from({ length: 51 }, (_, i) => task(`t${i}`, ["desktop"]))).ok, false, "51");
  equal(validateTaskList([task("a", ["desktop"]), task("a", ["ios"])]).ok, false, "duplicate ids");
});

test("newTaskId never collides, even with a broken random source", () => {
  const ids = new Set(TASKS.map((t) => t.id));
  const random = seededRandom(5);
  for (let i = 0; i < 200; i += 1) {
    const id = newTaskId(ids, random);
    assert(!ids.has(id) && /^task-[a-z0-9]+$/.test(id), `fresh id ${id}`);
    ids.add(id);
  }
  const stuck = new Set();
  for (let i = 0; i < 5; i += 1) stuck.add(newTaskId(stuck, () => 0));

test("people with identical team and devices always end within one task of each other", () => {
  // Same team + same devices ⇒ they are in exactly the same pools.
  for (let seed = 1; seed <= 300; seed += 1) {
    const random = seededRandom(seed * 7919);
    const roster = randomRoster(random);
    if (!roster.some((p) => p.online)) roster[0].online = true;
    const r = assignTasks(TASKS, roster, random);
    const count = loads(r, roster);
    const groups = new Map();
    for (const p of roster.filter((x) => x.online)) {
      const key = `${p.team}|${Boolean(p.mac)}|${Boolean(p.android)}|${Boolean(p.ios)}`;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(count.get(p.user_id));
    }
    for (const [key, values] of groups) {
      assert(Math.max(...values) - Math.min(...values) <= 1, `seed ${seed}, group ${key}: ${values}`);
    }
  }
});

// ---------------------------------------------------------------- everyone gets a task
function mixedRoster(random, size, { desktopOnlyShare = 0.25 } = {}) {
  const teams = ["AF", "CYD", "PB"];
  return Array.from({ length: size }, (_, i) => {
    const desktopOnly = random() < desktopOnlyShare;
    const d = random();
    return person(i === 0 ? "Moderator" : `P${i}`, teams[Math.floor(random() * 3)], desktopOnly ? {} : {
      mac: random() < 0.35, android: d < 0.5, ios: d > 0.4
    });
  });
}

test("everyone online with a task they can take gets one (800 rooms of 1–30 people); only crowded rooms share", () => {
  for (let seed = 1; seed <= 800; seed += 1) {
    const random = seededRandom(seed * 101);
    const roster = mixedRoster(random, 1 + Math.floor(random() * 30));
    const tasks = random() < 0.35 ? withCriticalFlows(defaultTasks(), false) : defaultTasks();
    const r = assignTasks(tasks, roster, random);
    const able = roster.filter((p) => compatibleCount(tasks, p) > 0);
    equal(withTask(r, roster).length, able.length, `seed ${seed}: ${roster.length} people, ${able.length} can take a task`);
    equal(peopleShortOfTasks(tasks, roster, 1).length, roster.length - able.length, `seed ${seed}: warning count`);
    for (const a of r.assignments) for (const o of a.owners) assert(canReceiveTask(a.task, byId(roster).get(o.user_id)), "device rule");
    // A task gets a second tester only when the one-each matching couldn't cover someone
    const shared = r.assignments.filter((a) => a.owners.length > 1).length;
    if (maxCover(tasks, roster) === roster.length) equal(shared, 0, `seed ${seed}: nobody shares when everyone fits`);
  }
});

test("tasks per person: everyone gets at least min(N, what they can take), extras spread, no one twice on a task (600 rooms)", () => {
  for (let seed = 1; seed <= 600; seed += 1) {
    const random = seededRandom(seed * 7);
    const roster = mixedRoster(random, 1 + Math.floor(random() * 30));
    const n = 1 + Math.floor(random() * 5);
    const tasks = random() < 0.5 ? withCriticalFlows(defaultTasks(), false).slice(0, 4 + Math.floor(random() * 20)) : defaultTasks();
    const r = assignTasks(tasks, roster, random, { tasksPerPerson: n });
    equal(r.assignments.map((a) => a.task_id), tasks.map((t) => t.id), `seed ${seed}: every task once, in order`);
    const count = loads(r, roster);
    for (const p of roster) {
      const want = Math.min(n, compatibleCount(tasks, p));
      assert(count.get(p.user_id) >= want, `seed ${seed}: ${p.name} has ${count.get(p.user_id)}, wants ${want}`);
    }
    equal(peopleShortOfTasks(tasks, roster, n).length, roster.filter((p) => compatibleCount(tasks, p) < n).length, `seed ${seed}: shortfall count`);
    for (const a of r.assignments) {
      equal(new Set(ownerIds(a)).size, a.owners.length, `seed ${seed}: nobody twice on ${a.task_id}`);
      for (const o of a.owners) assert(canReceiveTask(a.task, byId(roster).get(o.user_id)), `seed ${seed}: device rule on ${a.task_id}`);
      const anyone = roster.some((p) => canReceiveTask(a.task, p));
      equal(a.owners.length > 0, anyone, `seed ${seed}: ${a.task_id} has a tester exactly when someone can take it`);
      equal(a.reason === null, a.owners.length > 0, "reason only when unassigned");
    }
  }
});

// ---------------------------------------------------------------- property check
test("property check over 500 random rosters: phone rule, team rule, offline rule", () => {
  for (let seed = 1; seed <= 500; seed += 1) {
    const random = seededRandom(seed);
    const roster = randomRoster(random);
    const r = assignTasks(TASKS, roster, random);
    const online = roster.filter((p) => p.online);
    if (online.length === 0) { equal(r.ok, false, `seed ${seed} empty`); continue; }
    const keepsTeams = maxCover(TASKS, online, preferredEdge) === online.length;
    equal(withTask(r, online).length, maxCover(TASKS, online), `seed ${seed}: as many people as possible get a task`);
    const people = byId(roster);
    for (const a of r.assignments) {
      const compatible = online.filter((p) => canReceiveTask(a.task, p));
      if (holderId(a) === null) {
        equal(compatible.length, 0, `seed ${seed}: ${a.task_id} unassigned while someone could take it`);
        continue;
      }
      const p = people.get(holderId(a));
      assert(p.online, `seed ${seed}: offline person assigned`);
      assert(canReceiveTask(a.task, p), `seed ${seed}: phone rule broken on ${a.task_id}`);
      if (a.task.team) {
        const ownTeamAvailable = compatible.some((c) => c.team === a.task.team);
        if (keepsTeams) equal(p.team === a.task.team, ownTeamAvailable, `seed ${seed}: team rule on ${a.task_id}`);
        equal(teamMatch(a), p.team === a.task.team, "team_match value");
      }
      equal(holder(a).name, p.name, "participant snapshot");
    }
  }
});

test("takeoverChanges: what other people's actions changed for me, and only within one spin", () => {
  const room = { host_user_id: "host", status: "spun", spins_used: 1, state_version: 5 };
  const T = (id, who, extra = {}) => normalizeAssignment({ task_id: id, task: task(id, ["desktop"]), participant_id: who, participant: who ? { name: who } : null, team_match: null, reason: null, ...extra });
  const snap = (assignments, requests, over = {}) => ({ room: { ...room, ...over }, participants: [], spins: [{ spin_number: 1, assignments }], requests });
  const holderOf = { a: "me", b: "bob", c: null };
  const req = (id, taskId, who, status, created = "t1", from = holderOf[taskId]) => ({ id, task_id: taskId, user_id: who, from_user_id: from, status, created_at: created, resolved_by: null });
  const base = snap([T("a", "me"), T("b", "bob"), T("c", null)], []);

  // a request lands on my task (and the moderator hears about every request)
  const asked = snap([T("a", "me"), T("b", "bob"), T("c", null)], [req("r1", "a", "cy", "pending"), req("r2", "b", "cy", "pending"), req("r3", "c", "cy", "pending")]);
  equal(takeoverChanges(base, asked, "me").map((c) => [c.kind, c.task.id, c.by, c.mine]), [["asked", "a", "cy", true]], "holder: only my task");
  equal(takeoverChanges(base, asked, "host").map((c) => [c.kind, c.task.id, c.mine]), [["asked", "a", false], ["asked", "b", false], ["asked", "c", false]], "moderator: every request");
  equal(takeoverChanges(base, asked, "cy"), [], "the requester hears nothing about their own requests");
  equal(takeoverChanges(asked, asked, "me"), [], "nothing new: silent");
  // the same row re-made after a withdrawal counts as new (same id, new created_at)
  const remade = snap(asked.spins[0].assignments, [req("r1", "a", "cy", "pending", "t2")]);
  equal(takeoverChanges(asked, remade, "me").map((c) => c.kind), ["asked"], "re-made request announced again");

  // my request approved / declined, and a task of mine going away
  const mineAsked = snap([T("a", "me"), T("b", "bob"), T("c", null)], [req("r5", "b", "me", "pending"), req("r6", "c", "me", "pending")]);
  const answered = snap([T("a", "cy", { took_over_from: { user_id: "me", name: "me" }, took_over_at: "x" }), T("b", "me", { took_over_from: { user_id: "bob", name: "bob" }, took_over_at: "x" }), T("c", null)],
    [{ ...req("r5", "b", "me", "approved"), resolved_by: "bob" }, { ...req("r6", "c", "me", "declined"), resolved_by: "host" }]);
  equal(takeoverChanges(mineAsked, answered, "me").map((c) => [c.kind, c.task.id, c.by ?? c.to ?? null]),
    [["approved", "b", null], ["declined", "c", "host"], ["lost", "a", "cy"]], "approved, declined, lost");
  const relented = snap([T("a", "cy"), T("b", "me"), T("c", "me", { took_over_at: "y" })], [answered.requests[0], { ...req("r6", "c", "me", "approved"), resolved_by: "host" }]);
  equal(takeoverChanges(answered, relented, "me").map((c) => [c.kind, c.task.id]), [["approved", "c"]], "a declined request approved after all");
  equal(takeoverChanges(relented, relented, "me"), [], "settled: silent");
  // a pending request from someone else for a task that just became mine now waits for me
  const inherited = snap(answered.spins[0].assignments, [...answered.requests, req("r7", "b", "cy", "pending", "t1", "me")]);
  const inheritedBefore = snap(mineAsked.spins[0].assignments, [...mineAsked.requests, req("r7", "b", "cy", "pending")]);
  equal(takeoverChanges(inheritedBefore, inherited, "me").filter((c) => c.kind === "asked").map((c) => [c.task.id, c.by]), [["b", "cy"]], "inherited request announced to the new owner");

  // never across spins, never in the lobby, never without snapshots
  equal(takeoverChanges(base, { ...asked, room: { ...room, spins_used: 2 } }, "me"), [], "spin changed");
  equal(takeoverChanges(snap([], [], { status: "lobby", spins_used: 0 }), snap([], [], { status: "lobby", spins_used: 0 }), "me"), [], "lobby");
  equal(takeoverChanges(null, asked, "me"), [], "no previous snapshot");
  equal(takeoverChanges(base, { ...asked, requests: undefined }, "me"), [], "no requests list at all");
});
