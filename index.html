<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8fb">
  <meta name="description" content="A cheerful, team-aware QA task roulette for WheelOfTest.">
  <title>WheelOfTest — QA assignment roulette</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="WheelOfTest home">
        <span class="brand-mark" aria-hidden="true">✳</span>
        <span>WheelOfTest</span>
      </a>
      <div class="topbar-tag"><span class="status-dot"></span> QA assignment party</div>
    </header>

    <main id="app" class="main-content" aria-live="polite">
      <section class="card loading-card">
        <span class="loading-orbit" aria-hidden="true">✦</span>
        <p>Getting the wheel ready…</p>
      </section>
    </main>

    <footer class="site-footer">
      <span>Made for curious testers ✨</span>
      <span>Static app · No account needed</span>
    </footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
